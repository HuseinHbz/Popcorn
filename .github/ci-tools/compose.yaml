# CI-only tool images, pinned by digest and kept current by Dependabot (docker-compose).
# The history scan mounts the repository read-only; the tree scan and Semgrep read a tree
# the CI step exports and mounts (see each service). Run from the repo root:
#   docker compose -f .github/ci-tools/compose.yaml run --rm [-v …] <tool>
name: popcorn-ci-tools

services:
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    # gitleaks reads .gitleaksignore from the scanned repository and its working directory;
    # --config pins the rules and --ignore-gitleaks-allow disables inline allow comments, so
    # the scanned code cannot relax the scan (ADR 0016). gitleaks' default `git log` options
    # skip merge diffs and type changes (a symlink turned into a file); `-m` and a
    # --diff-filter without `t` scan both. gitleaks splits --log-opts on spaces.
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - git
      - /repo
      - --log-opts=--full-history --all -m --diff-filter=uxdb
      - --config
      - /repo/.github/ci-tools/gitleaks.toml
      - --ignore-gitleaks-allow
      - --redact
      - --verbose

  # The current tree, with the same pinned rules. The CI step mounts the exported tree at
  # /tree and a writable /report (`run -v …`). gitleaks reports a missing or empty directory
  # as clean, so the rules are read from inside the tree: without the mount, or with an
  # empty export, the configuration file is missing and the scan fails. The CI step also
  # plants a canary and requires the report to hold that finding and no other.
  gitleaks-tree:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    command:
      - dir
      - /tree
      - --config
      - /tree/.github/ci-tools/gitleaks.toml
      - --ignore-gitleaks-allow
      - --report-format
      - json
      - --report-path
      - /report/tree.json
      - --redact
      - --verbose

  # The CI step mounts the exported tree at /src, with the pinned ignore file copied in as
  # its .semgrepignore, and a writable /report. Without a .semgrepignore, Semgrep skips every
  # test/, tests/, vendor/, build/ and dist/ directory; the step checks which files it read.
  semgrep:
    image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    working_dir: /src
    command:
      - semgrep
      - scan
      - --metrics=off
      - --error
      # Inline suppression comments in the scanned code have no effect (ADR 0016).
      - --disable-nosem
      - --config=p/typescript
      - --config=p/react
      - --config=p/nextjs
      - --config=p/secrets
      - --json-output=/report/semgrep.json
