# Supply-chain guard: never resolve a version published less than 24 hours ago
# (most hijacked releases are pulled within hours). See ADR 0014.
minimumReleaseAge: 1440
# Fail the install if a dependency wants to run a build script nobody approved
# (package.json pnpm.onlyBuiltDependencies / ignoredBuiltDependencies).
strictDepBuilds: true
